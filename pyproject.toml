[project]
name = "air-quality-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Omar", email = "OmarAbdullah.q@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "evidently>=0.7.21",
    "fastapi>=0.140.13",
    "joblib>=1.5.3",
    "mlflow>=3.14.0",
    "numpy>=2.5.1",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
air-quality-mlops = "air_quality_mlops:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
